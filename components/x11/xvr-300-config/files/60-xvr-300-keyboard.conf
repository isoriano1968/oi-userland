# The X keyboard: a Sun Type 7 USB keyboard (as shipped with the Ultra 45).
# Set XkbLayout to yours ("de", "gb", "fr", ...); for European layouts
# use the model sun_type7_euro_usb, for Japanese sun_type7_jp_usb.
# The Sun models map the Sun keys (Mute, Volume, Stop, Again, Props, Undo,
# Front, Copy, Open, Paste, Find, Cut, Help, Compose).
# This file is kept when the package is updated.

Section "InputDevice"
    Identifier "Keyboard0"
    Driver "kbd"
    Option "Device" "/dev/kbd"
    Option "XkbModel" "sun_type7_usb"
    Option "XkbLayout" "us"
EndSection
