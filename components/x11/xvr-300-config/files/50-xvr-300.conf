# Sun XVR-300 (Radeon RV370) in slot PCI-E 2 of an Ultra 45.
#
# Tested with a digital monitor at 1680x1050.  For another mode change the
# ModeLine, PreferredMode and Virtual.  BusID: see scanpci for another slot.
#
# NoAccel: there is no DRM driver for this card on illumos yet.
# ConnectorTable: the card has FCode instead of a PC BIOS, so the driver
# cannot tell that the DVI port is digital.

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Module"
    Disable "dri"
    Disable "dri2"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync 28-70
    VertRefresh 50-75
    ModeLine "1680x1050" 119.00 1680 1728 1760 1840 1050 1053 1059 1080 +hsync -vsync
    Option "PreferredMode" "1680x1050"
    Option "Enable" "true"
EndSection

Section "Device"
    Identifier "XVR300"
    Driver "radeon"
    BusID "PCI:2@1:0:0"
    Option "NoAccel" "true"
    Option "SWcursor" "true"
    Option "monitor-DVI-0" "Monitor0"
    Option "monitor-DVI-1" "Monitor0"
    Option "ConnectorTable" "100,0,1,3,96,0,2,3"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "XVR300"
    Monitor "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1680 1050
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "mouse"
    Option "Protocol" "auto"
    Option "Device" "/dev/mouse"
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen "Screen0"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0" "CorePointer"
EndSection
